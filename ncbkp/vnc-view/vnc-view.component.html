<!--The content below is only a placeholder and can be replaced.-->
<div style="text-align: left;">

  <form class="m-x--4">
    <mat-form-field class="m-x-4" appearance="outline">
      <input matInput name="host" placeholder="Host" id="hostInput" [disabled]="vncAtivo || isLoading" [(ngModel)]="host">
    </mat-form-field>

    <button #btnStart mat-icon-button="" title="{{'connect' | translate}}"
            [disabled]="(vncAtivo || isLoading || (host.length <= 0))"
            (click)="startClient()">
      <mat-icon *ngIf="!isLoading">visibility</mat-icon>
      <mat-spinner *ngIf="isLoading" diameter="20" style="display: inline-block;"></mat-spinner>
    </button>

    <button mat-icon-button="" title="{{'disconect' | translate}}"
            [disabled]="!vncAtivo"
            (click)="stopClient()">
      <mat-icon>visibility_off</mat-icon>
    </button>

    <button mat-icon-button="" title="{{'fullscreen' | translate}}"
            [disabled]="!vncAtivo"
            (click)="makeFullScreen()">
      <mat-icon>fullscreen</mat-icon>
    </button>

    <!-- Menu de comandos (mostrado apenas quando conectado) -->
    <ng-container *ngIf="vncAtivo">
      <button mat-icon-button="" [matMenuTriggerFor]="commandsMenu" title="Comandos do teclado">
        <mat-icon>keyboard</mat-icon>
      </button>
      <mat-menu #commandsMenu="matMenu">
        <button mat-menu-item *ngFor="let cmd of commands" (click)="cmd.action()">
          <mat-icon>{{cmd.icon}}</mat-icon>
          <span>{{cmd.name}}</span>
        </button>
      </mat-menu>

      <button mat-icon-button="" title="Capturar tela" (click)="takeScreenshot()">
        <mat-icon>photo_camera</mat-icon>
      </button>

      <button mat-icon-button="" title="Zoom ({{zoomLevel}}%)" (click)="adjustScaling()">
        <mat-icon>zoom_in</mat-icon>
      </button>

      <button mat-icon-button="" title="Resetar zoom" (click)="resetScaling()">
        <mat-icon>restore</mat-icon>
      </button>

      <!-- Informações compactas -->
      <span *ngIf="connectionStats" style="margin-left: 8px; font-size: 12px; color: #666;"
            title="Latência: {{connectionStats.latency}}ms">
        <mat-icon style="font-size: 14px; vertical-align: middle;">speed</mat-icon>
        {{connectionStats.latency}}ms
      </span>

      <span *ngIf="reconnectCount > 0" style="margin-left: 8px; font-size: 12px; color: #666;"
            title="Tentativas de reconexão">
        <mat-icon style="font-size: 14px; vertical-align: middle;">refresh</mat-icon>
        {{reconnectCount}}
      </span>
    </ng-container>

    <span id="status" style="margin-left: 16px; font-weight: 500;">
      {{statusDisplay}} {{desktopName}}
    </span>

    <span id="status_exe" style="color:blue; margin-left: 8px; font-weight: 500;">
      {{statusMessage}}
    </span>
  </form>

</div>

<div id="vncView" [hidden]="!vncAtivo" style="margin-top: 16px; border: 1px solid #ccc; background: #000; min-height: 400px; position: relative;">

  <!-- Overlay de carregamento -->
  <div *ngIf="isLoading" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.7); color: white; z-index: 10;">
    <mat-spinner diameter="40"></mat-spinner>
    <p style="margin-top: 8px; font-size: 14px;">
      {{ (connectionState === 'RECONECTANDO' ? 'Reconectando...' : 'Conectando...') }}
    </p>
  </div>

  <div id="screen" style="width: 100%; height: 100%; min-height: 400px; transform-origin: top left;">
    <!-- This is where the remote screen will appear -->
  </div>

  <!-- Controles flutuantes na tela -->
  <div class="vnc-controls-overlay"
       style="position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; opacity: 0.7;">
    <button mat-mini-fab (click)="makeFullScreen()" style="background: rgba(0, 0, 0, 0.7); color: white; width: 32px; height: 32px;">
      <mat-icon style="font-size: 18px;">fullscreen</mat-icon>
    </button>
    <button mat-mini-fab (click)="sendCtrlAltDel()" style="background: rgba(0, 0, 0, 0.7); color: white; width: 32px; height: 32px;">
      <mat-icon style="font-size: 18px;">keyboard</mat-icon>
    </button>
    <button mat-mini-fab (click)="takeScreenshot()" style="background: rgba(0, 0, 0, 0.7); color: white; width: 32px; height: 32px;">
      <mat-icon style="font-size: 18px;">photo_camera</mat-icon>
    </button>
  </div>
</div>

<!-- Modal para captura de tela -->
<div *ngIf="screenshotData" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000;"
     (click)="closeScreenshot()">
  <div style="background: white; padding: 16px; border-radius: 8px; max-width: 90%; max-height: 90%;"
       (click)="$event.stopPropagation()">
    <h3 style="margin: 0 0 12px 0;">Captura de Tela - {{host}}</h3>
    <img [src]="screenshotData" alt="Captura" style="max-width: 100%; max-height: 70vh; border: 1px solid #ddd;">
    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;">
      <button mat-flat-button color="primary" (click)="downloadScreenshot()">Download</button>
      <button mat-button (click)="closeScreenshot()">Fechar</button>
    </div>
  </div>
</div>
