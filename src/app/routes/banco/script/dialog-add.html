<mat-card class="dialog-add-card">

  <mat-card-content class="dialog-add-content">

    <form [formGroup]="reactiveForm" class="dialog-add-form">

      <!-- Nome -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" autocomplete="off">
      </mat-form-field>

      <!-- Tipo -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Tipo</mat-label>
        <mat-select formControlName="tipoSql">
          <mat-option value="QUERY">QUERY (SELECT com bind variables)</mat-option>
          <mat-option value="PROCEDURE">PROCEDURE (PL/SQL com SYS_REFCURSOR de saída)</mat-option>
          <mat-option value="FUNCTION">FUNCTION (PL/SQL que retorna SYS_REFCURSOR)</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Função -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Função</mat-label>
        <textarea
          matInput
          formControlName="funcao"
          rows="3"
          style="resize: vertical;">
        </textarea>
      </mat-form-field>

      <!-- Editor: SELECT para QUERY -->
      <div class="editor-wrapper" *ngIf="reactiveForm.get('tipoSql')!.value === 'QUERY'">
        <code-editor-app
          style="height: 100%; width: 100%; display: block;"
          [language]="'plsql'"
          [value]="reactiveForm.get('script')!.value"
          (valueChange)="onScriptChange($event)">
        </code-editor-app>
      </div>

      <!-- Campo texto: nome qualificado para PROCEDURE/FUNCTION -->
      <mat-form-field appearance="outline" class="full-width"
        *ngIf="reactiveForm.get('tipoSql')!.value !== 'QUERY'">
        <mat-label>Nome qualificado do objeto PL/SQL (schema.pacote.nome)</mat-label>
        <input matInput formControlName="script" autocomplete="off"
          placeholder="ex: DBAMV.PCK_RELATORIOS.PRC_EXTRAI_FATURAMENTO">
      </mat-form-field>

    </form>

  </mat-card-content>

  <mat-card-actions class="dialog-add-actions">

    <button
      mat-stroked-button
      color="warn"
      type="button"
      (click)="closeDialog()">
      Cancelar
    </button>

    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="salvar()">
      Salvar
    </button>

  </mat-card-actions>

</mat-card>
