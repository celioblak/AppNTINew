<div class="container-fluid" [class.mobile]="isMobile">

  <div class="filter-container" [class.mobile-layout]="isMobile">
    <mat-form-field appearance="outline">
      <mat-label>Selecione um Grupo</mat-label>
      <mat-select [(ngModel)]="grupoSelecionado" (selectionChange)="changeGrupo($event.value)" name="grupo">
        <mat-option [value]="todosGrupos">TODOS</mat-option>
        <mat-option *ngFor="let grupo of listGrupo" [value]="grupo">
          {{grupo.dsGrupo}}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Valor Pesquisa</mat-label>
      <input #filterValue matInput name="vlPesquisar"
             [(ngModel)]="termoPesquisa"
             (input)="searchFiltro(filterValue)"
             (keyup.enter)="searchFiltro(filterValue)"
             placeholder="Qualquer atributo do servidor...">
    </mat-form-field>

    <div class="search-button-wrapper">
      <button aria-label="Pesquisar" mat-fab color="primary" (click)="searchFiltro(filterValue)">
        <mat-icon>search</mat-icon>
      </button>
    </div>

    <mat-slide-toggle class="toggle-ativos"
                      [(ngModel)]="apenasAtivos"
                      (change)="onToggleApenasAtivos()"
                      color="primary"
                      matTooltip="Exibir somente servidores ativos"
                      matTooltipPosition="above">
      Apenas ativos
    </mat-slide-toggle>
  </div>

  <mat-card>
    <mat-card-content>

      <div class="section-title">
        <h3>Servidores</h3>
        <button mat-icon-button [matMenuTriggerFor]="menu1" aria-label="Ações do servidor">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu1="matMenu">
          <button mat-menu-item (click)="openAddDialogAdicionar()">
            <mat-icon>add</mat-icon>
            <span>Adicionar</span>
          </button>
          <button [disabled]="!servidorSelecionado.codServidor" mat-menu-item (click)="openEditDialog()">
            <mat-icon>edit</mat-icon>
            <span>Editar</span>
          </button>
          <button [disabled]="!servidorSelecionado.codServidor" mat-menu-item (click)="openDeleteDialog()">
            <mat-icon>delete</mat-icon>
            <span>Excluir</span>
          </button>
          <button [disabled]="!servidorSelecionado.codServidor" mat-menu-item (click)="abrirTerminalSsh()">
            <mat-icon>terminal</mat-icon>
            <span>Terminal SSH</span>
          </button>
        </mat-menu>
      </div>

      <div class="grid-wrapper" tabindex="0" (keydown)="onGridKeyDown($event, 'servidor')">
        <mtx-grid [data]="list"
                  [columns]="isMobile ? columnsServidorMobile : columnsServidorDesktop"
                  [rowStriped]="true"
                  [showPaginator]="true"
                  [pageSize]="10"
                  [noResultText]="noResult"
                  (rowClick)="onRowClick($event, 'servidor')"
                  [cellTemplate]="{ snAtivo: statusAtivoTpl, snMonitorado: statusMonitoramentoTpl }" />
      </div>

      <div class="responsive-layout" [class.mobile-columns]="isMobile">

        <div class="responsive-column" [class.main-column]="!isMobile">
          <div class="section-title">
            <h3>Processos</h3>
            <button mat-icon-button [matMenuTriggerFor]="menu2" aria-label="Ações do processo">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu2="matMenu">
              <button [disabled]="!servidorSelecionado.codServidor" mat-menu-item (click)="openAddProcessoDialog()">
                <mat-icon>add</mat-icon>
                <span>Adicionar</span>
              </button>
              <button [disabled]="!processoSelecionado.codProcesso" mat-menu-item (click)="openEditProcessoDialog()">
                <mat-icon>edit</mat-icon>
                <span>Editar</span>
              </button>
              <button [disabled]="!processoSelecionado.codProcesso" mat-menu-item (click)="openDeleteProcessoDialog()">
                <mat-icon>delete</mat-icon>
                <span>Excluir</span>
              </button>
            </mat-menu>
          </div>

          <div class="grid-wrapper" tabindex="0" (keydown)="onGridKeyDown($event, 'processo')">
            <mtx-grid [data]="listProcesso"
                      [columns]="isMobile ? columnsProcessoMobile : columnsProcessoDesktop"
                      [rowStriped]="true"
                      [showPaginator]="true"
                      [pageSize]="10"
                      [noResultText]="noResult"
                      (rowClick)="onRowClick($event, 'processo')"
                      [cellTemplate]="{ dsStatus: statusProcessoTpl, snMonitorado: statusMonitoramentoTpl, dsProcesso: dsProcessoTpl }" />
          </div>
        </div>

        <div class="responsive-column" [class.sidebar-column]="!isMobile">
          <div class="section-title">
            <h3>Parâmetros</h3>
            <button mat-icon-button [matMenuTriggerFor]="menu3" aria-label="Ações do parâmetro">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu3="matMenu">
              <button [disabled]="!processoSelecionado.codProcesso" mat-menu-item (click)="openAddParametroDialog()">
                <mat-icon>add</mat-icon>
                <span>Adicionar</span>
              </button>
              <button [disabled]="!paramentroSelecionado.codParametro" mat-menu-item (click)="openEditParametroDialog()">
                <mat-icon>edit</mat-icon>
                <span>Editar</span>
              </button>
              <button [disabled]="!paramentroSelecionado.codParametro" mat-menu-item (click)="openDeleteParametroDialog()">
                <mat-icon>delete</mat-icon>
                <span>Excluir</span>
              </button>
            </mat-menu>
          </div>

          <div class="grid-wrapper" tabindex="0" (keydown)="onGridKeyDown($event, 'parametro')">
            <mtx-grid [data]="listParamentro"
                      [columns]="isMobile ? columnsParamentroMobile : columnsParamentroDesktop"
                      [rowStriped]="true"
                      [showPaginator]="true"
                      [pageSize]="10"
                      [noResultText]="noResult"
                      (rowClick)="onRowClick($event, 'parametro')"
                      [cellTemplate]="{ snMonitorado: statusMonitoramentoTpl }" />
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>

<!-- TEMPLATES -->
<ng-template #statusAtivoTpl let-row>
  <div class="center_item">
    <mat-icon *ngIf="row.snAtivo" color="primary"
              [matTooltip]="'Servidor Ativo'" matTooltipPosition="above">power</mat-icon>
    <mat-icon *ngIf="!row.snAtivo" color="warn"
              [matTooltip]="'Servidor Inativo'" matTooltipPosition="above">power_off</mat-icon>
  </div>
</ng-template>

<ng-template #statusProcessoTpl let-row>
  <div class="center_item">
    <mat-icon *ngIf="row.dsStatus == 'INICIADO'" color="primary"
              [matTooltip]="'Processo Iniciado'" matTooltipPosition="above">cloud_queue</mat-icon>
    <mat-icon *ngIf="row.dsStatus == 'PARADO'" color="warn"
              [matTooltip]="'Processo Parado'" matTooltipPosition="above">cloud_off</mat-icon>
    <mat-icon *ngIf="!row.dsStatus"
              [matTooltip]="'Status não informado'" matTooltipPosition="above">cloud</mat-icon>
  </div>
</ng-template>

<ng-template #statusMonitoramentoTpl let-row>
  <div class="center_item">
    <mat-icon *ngIf="row.snMonitorado" color="primary"
              [matTooltip]="'Monitorado'" matTooltipPosition="above">toggle_on</mat-icon>
    <mat-icon *ngIf="!row.snMonitorado"
              [matTooltip]="'Não Monitorado'" matTooltipPosition="above">toggle_off</mat-icon>
  </div>
</ng-template>

<ng-template #dsProcessoTpl let-row>
  <span [matTooltip]="row.dsProcessoDetalhe || row.dsProcesso"
        matTooltipPosition="above"
        matTooltipClass="tooltip-multiline">
    {{ row.dsProcesso }}
  </span>
</ng-template>
