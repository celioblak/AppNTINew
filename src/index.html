<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>NTI Consultoria</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="fonts/Material_Icons.css">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Roboto:300,400,500&display=swap">
  <style type="text/css">
    .global-loader {
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      background-color: #fff;
      opacity: 1;
      transition: opacity .5s ease-in-out;
    }

    .global-loader-fade-out {
      opacity: 0;
    }

    .global-loader-hidden {
      display: none;
    }

    .global-loader h1 {
      font-family: "Helvetica Neue", Helvetica, sans-serif;
      font-weight: normal;
      font-size: 1.5rem;
      letter-spacing: .04rem;
      white-space: pre;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      background-image:
        repeating-linear-gradient(
          to right,
          #f44336,
          #9c27b0,
          #3f51b5,
          #03a9f4,
          #009688,
          #8bc34a,
          #ffeb3b,
          #ff9800
        );
      background-size: 750% auto;
      background-position: 0 100%;
      animation: gradient 20s infinite;
      animation-fill-mode: forwards;
      animation-timing-function: linear;
    }

    @keyframes gradient {
      0% {
        background-position: 0 0;
      }

      100% {
        background-position: -750% 0;
      }
    }
    .loading-dots {
  display: inline-block;
  overflow: hidden;
  width: 1.2em;           /* controla o espaço dos pontos */
  vertical-align: bottom;
}

.loading-dots::after {
  content: "\2026";        /* reticências horizontais … */
  display: inline-block;
  animation: dots 1.8s steps(4, end) infinite;
}

@keyframes dots {
  0%   { content: ".";    }
  25%  { content: "..";   }
  50%  { content: "...";  }
  75%  { content: "...."; }
  100% { content: ".";    }
}
  </style>
</head>

<body>
  <app-root></app-root>
  <div id="globalLoader" class="global-loader">
    <h1>Carregando<span class="loading-dots"></span></h1>
  </div>
</body>

</html>
